# infra/docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bms}
      POSTGRES_DB: bms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms -d bms"]
      interval: 5s
      timeout: 3s
      retries: 10
    # G3a: internal-only — nginx is the sole published surface (review M11).
    expose:
      - "5432"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://bms:${POSTGRES_PASSWORD:-bms}@postgres:5432/bms
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../apps/web/dist:/usr/share/nginx/html:ro
    # HTTP_PORT/HTTPS_PORT overridable: e.g. Windows host reserves 80 via Hyper-V exclusion.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - api

volumes:
  pgdata:
  backups:
