services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms
      POSTGRES_DB: bms_test
    ports: ["5433:5433"]
    command: ["postgres", "-p", "5433"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms -p 5433"]
      interval: 2s
      timeout: 3s
      retries: 30
